services:
  # Service untuk Aplikasi (PHP-FPM)
  app:
    build:
      context: . # Bangun dari Dockerfile di direktori ini
      dockerfile: Dockerfile
    container_name: pvc_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - pvc-network

  # Service untuk Web Server (Nginx)
  nginx:
    platform: linux/amd64
    image: nginx:1.19-alpine
    container_name: pvc_nginx
    restart: unless-stopped
    ports:
      - "8080:80" # Buka port 80 VPS ke port 80 container
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pvc-network
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Service untuk Database (MySQL)
  mysql:
    platform: linux/amd64
    image: mysql:8.0
    container_name: pvc_mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # Gunakan password yang sama
    volumes:
      - pvc-db-data:/var/lib/mysql # Volume untuk menyimpan data database secara permanen
    networks:
      - pvc-network

networks:
  pvc-network:
    driver: bridge

volumes:
  pvc-db-data:
    driver: local
